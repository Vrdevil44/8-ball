<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050a05" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="8-Ball AR" />
  <meta name="description" content="Real-time AR 8-Ball Pool Assistant — cue detection, ghost ball, shot AI" />
  <meta property="og:title" content="8-Ball Pool Assistant" />
  <meta property="og:description" content="Real-time pool coaching in the browser: physics, ghost-ball aiming, AI shot recommendations. Phone-first, works offline." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vrdevil44.github.io/8-ball/" />
  <meta property="og:image" content="https://vrdevil44.github.io/8-ball/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="8-Ball Pool Assistant" />
  <meta name="twitter:description" content="Real-time pool coaching in the browser: physics, ghost-ball aiming, AI shot recommendations. Phone-first, works offline." />
  <meta name="twitter:image" content="https://vrdevil44.github.io/8-ball/og-image.png" />
  <title>8-Ball AR Pool Assistant</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     AR Layer  (full-screen: video + canvas overlay)
══════════════════════════════════════════════════ -->
<div id="ar-overlay">

  <!-- Camera feed – sits behind the canvas via z-index -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Drawing canvas – full screen, sits on top of video -->
  <canvas id="ar-canvas" role="img" aria-label="Pool table. Drag from the cue ball to aim and release to shoot."></canvas>

  <!-- ── Top HUD strip ── -->
  <header id="top-hud">
    <div class="hud-left">
      <span class="logo-mark">🎱</span>
      <span id="ar-status-badge" class="ar-status-badge ar-status-idle">○ Off</span>
    </div>
    <div class="hud-centre">
      <span id="ar-status-text" class="status-text" role="status" aria-live="polite">Ready</span>
    </div>
    <div class="hud-right">
      <!-- Mode buttons -->
      <button id="btn-ar"  class="hud-btn primary" aria-label="Start or stop camera AR mode">📷 Start AR</button>
      <button id="btn-xr"  class="hud-btn accent"  style="display:none" aria-label="Start WebXR augmented reality">✦ WebXR</button>
      <button id="btn-panel-toggle" class="hud-btn ghost" aria-label="Toggle info panel" aria-expanded="false" aria-controls="info-panel">☰</button>
    </div>
  </header>

  <!-- ── AR Shot Badge (floating, appears when calibrated) ── -->
  <div id="shot-badge" class="shot-badge">
    <div class="badge-row">
      <span class="badge-label">Hit</span>
      <span class="badge-ball">—</span>
    </div>
    <div class="badge-row">
      <span class="badge-label">Pocket</span>
      <span class="badge-pocket">—</span>
    </div>
    <div class="badge-row">
      <span class="badge-diff">—</span>
      <span class="badge-power"></span>
    </div>
  </div>

  <!-- ── Cue stick detection badge ── -->
  <div id="stick-info" class="stick-badge" style="display:none" aria-live="off">
    🎯 Cue 0%
  </div>

  <!-- ── Detection stats ── -->
  <div id="detect-stats" class="detect-stats">
    <span>🔍 <span id="detect-balls">0</span> balls</span>
    <span>conf: <span id="detect-conf">0%</span></span>
  </div>

  <!-- ── Bottom Action Bar (AR mode controls) ── -->
  <div id="ar-controls" class="bottom-bar" style="display:none">
    <div class="power-row">
      <span class="power-icon">⚡</span>
      <input type="range" id="power-slider-ar" aria-label="Shot power" min="5" max="100" value="55" class="power-slider" />
      <span id="power-label-ar" class="power-val">55%</span>
    </div>
    <div class="action-row">
      <button id="btn-calibrate"   class="action-btn secondary">Calibrate</button>
      <button id="btn-shoot-ar"    class="action-btn primary" aria-label="Shoot the recommended shot">▶ Shoot!</button>
      <button id="btn-recalibrate" class="action-btn ghost">Re-cal</button>
    </div>
    <div class="action-row-sm">
      <button id="btn-merge-toggle" class="sm-btn">Auto-merge: ON</button>
      <select id="felt-select" aria-label="Table felt colour" class="sm-btn sel-input">
        <option value="green">Green felt</option>
        <option value="blue">Blue felt</option>
        <option value="tan">Tan felt</option>
      </select>
    </div>
  </div>

  <!-- ── Demo mode bottom bar ── -->
  <div id="demo-controls" class="bottom-bar demo-bar">
    <div class="power-row">
      <span class="power-icon">⚡</span>
      <input type="range" id="power-slider" aria-label="Shot power" min="5" max="100" value="55" class="power-slider" />
      <span id="power-label" class="power-val">55%</span>
    </div>
    <div class="action-row">
      <button id="btn-rack"      class="action-btn secondary" aria-label="Re-rack the balls">Rack</button>
      <button id="btn-shoot"     class="action-btn primary" aria-label="Shoot the recommended shot">▶ Shoot!</button>
      <button id="btn-new-game"  class="action-btn secondary" aria-label="Start a new game">New</button>
    </div>
    <div class="action-row-sm">
      <button id="btn-toggle-ai" class="sm-btn accent" aria-label="Toggle AI shot overlay">AI: ON</button>
      <button id="btn-random"    class="sm-btn" aria-label="Random layout">Random</button>
      <input type="number" id="ball-count" aria-label="Number of balls for random layout" inputmode="numeric" min="2" max="15" value="7" class="sm-input" />
    </div>
  </div>

  <!-- ── First-load hint (dismissed on first touch/shot, remembered) ── -->
  <div id="first-hint" class="first-hint hidden" role="note">Drag from the cue ball to aim, release to shoot</div>

</div><!-- /#ar-overlay -->

<!-- ═══════════════════════════════════════════════════
     Slide-up Info Panel
══════════════════════════════════════════════════ -->
<aside id="info-panel" class="info-panel" aria-label="Game information">
  <div class="panel-handle"></div>

  <!-- Game state -->
  <div class="panel-card">
    <h3 class="panel-title">Game State</h3>
    <div class="info-grid">
      <span class="ig-label">Phase</span>
      <span id="phase-badge" class="phase-badge">BREAK</span>
      <span class="ig-label">Turn</span>
      <span id="current-turn" class="ig-val highlight">Player 1</span>
      <span class="ig-label">P1</span>
      <span id="p1-group" class="ig-val">Open</span>
      <span class="ig-label">P2</span>
      <span id="p2-group" class="ig-val">Open</span>
    </div>
  </div>

  <!-- AI Shot info -->
  <div class="panel-card">
    <h3 class="panel-title">AI Recommendation</h3>
    <div id="shot-candidates" class="cand-label">Analysing…</div>
    <div class="info-grid">
      <span class="ig-label">Ball</span>
      <span id="shot-ball" class="ig-val">—</span>
      <span class="ig-label">Pocket</span>
      <span id="shot-pocket" class="ig-val">—</span>
      <span class="ig-label">Score</span>
      <span id="shot-score" class="ig-val">—</span>
      <span class="ig-label">Cut</span>
      <span id="shot-cut" class="ig-val">—</span>
      <span class="ig-label">Difficulty</span>
      <span id="shot-difficulty" class="ig-val">—</span>
      <span class="ig-label">Suggested ⚡</span>
      <span id="shot-power" class="ig-val highlight">—</span>
    </div>
  </div>

  <!-- Balls on table -->
  <div class="panel-card">
    <h3 class="panel-title">Balls on Table</h3>
    <div id="balls-remaining" class="balls-grid"></div>
  </div>

  <!-- Training data -->
  <div class="panel-card">
    <h3 class="panel-title">Training Data</h3>
    <div class="action-row">
      <button id="btn-stats"  class="sm-btn">📊 Stats</button>
      <button id="btn-export" class="sm-btn">⬇ Export JSON</button>
    </div>
  </div>

  <!-- Status text -->
  <div class="panel-card status-card">
    <span id="status-text" class="status-full" role="status" aria-live="polite">Ready</span>
  </div>

</aside>

<!-- ═══════════════════════════════════════════════════
     Scripts  (load order matters – no bundler)
══════════════════════════════════════════════════ -->
<script src="js/constants.js"></script>
<script src="js/physics.js"></script>
<script src="js/gameState.js"></script>
<script src="js/shotEngine.js"></script>
<script src="js/homography.js"></script>
<script src="js/arSession.js"></script>
<script src="js/stickDetector.js"></script>
<script src="js/tracker.js"></script>
<script src="js/training.js"></script>
<script src="js/detection.js"></script>
<script src="js/renderer.js"></script>
<script src="js/app.js"></script>

<!-- Service worker registration -->
<script>
  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
